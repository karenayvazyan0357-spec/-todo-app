<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Задачи — список дел</title>
    <meta name="description" content="Минималистичный список задач: работает офлайн, хранит данные только в вашем браузере." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />

    <!-- Тема ставится до отрисовки, чтобы светлая страница не мигала в тёмной теме. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('todo-app:theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* localStorage недоступен — останется светлая тема по умолчанию */
        }
      })();
    </script>

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />

    <script defer src="js/util.js"></script>
    <script defer src="js/icons.js"></script>
    <script defer src="js/schema.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/selectors.js"></script>
    <script defer src="js/state.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/render.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к задачам</a>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Списки задач">
        <div class="sidebar__head">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="M4 8h16M4 13h9M4 18h16" />
              </svg>
            </span>
            <span class="brand__name">Задачи</span>
          </div>
          <button class="icon-btn sidebar__close" id="sidebarClose" type="button" aria-label="Закрыть меню">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5" />
            </svg>
          </button>
        </div>

        <nav class="nav" aria-label="Проекты">
          <p class="nav__label" id="listsLabel">Списки</p>
          <ul class="nav__list" id="listNav" aria-labelledby="listsLabel"></ul>
        </nav>

        <div class="sidebar__foot">
          <p class="sidebar__note">Всё хранится только в вашем браузере. Без аккаунтов и серверов.</p>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <main class="main" id="main" tabindex="-1">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div class="topbar__title">
            <h1 class="page-title" id="pageTitle">Входящие</h1>
            <p class="page-subtitle">
              <span class="num" id="statTotal">0</span> <span id="statTotalWord">задач</span> ·
              <span class="num" id="statDone">0</span> выполнено
            </p>
          </div>
        </header>

        <div class="content">
          <form class="composer" id="composer" autocomplete="off" novalidate>
            <label class="sr-only" for="taskInput">Новая задача</label>
            <input
              class="composer__input"
              id="taskInput"
              name="title"
              type="text"
              maxlength="200"
              placeholder="Что нужно сделать?"
              autocomplete="off"
              enterkeyhint="done"
            />
            <button class="btn btn--primary composer__submit" type="submit">Добавить</button>
            <p class="composer__hint">Enter — добавить задачу. Всё сохраняется автоматически.</p>
          </form>

          <ul class="task-list" id="taskList" aria-label="Задачи"></ul>

          <div class="empty" id="emptyState">
            <div class="empty__art" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                <rect x="8.5" y="6.5" width="31" height="35" rx="3" />
                <path d="M15 16h12M15 23h18M15 30h10" />
                <circle cx="35.5" cy="35.5" r="7.5" fill="var(--bg)" stroke="var(--accent)" />
                <path d="m32.2 35.6 2.2 2.2 4.2-5" stroke="var(--accent)" stroke-linejoin="round" />
              </svg>
            </div>
            <h2 class="empty__title" id="emptyTitle">Пока пусто</h2>
            <p class="empty__text" id="emptyText">Добавьте первую задачу — начните с той, что важнее всего сегодня.</p>
          </div>
        </div>
      </main>
    </div>

    <div class="toasts" id="toasts" role="region" aria-label="Уведомления"></div>
    <p class="sr-only" id="live" role="status" aria-live="polite"></p>

    <noscript>
      <p class="noscript">Для работы списка задач нужен JavaScript. Обычно он включён в браузере по умолчанию.</p>
    </noscript>
  </body>
</html>
